# Development overlay: same row, but nothing opens a browser on its own.
#
# A patch replaces the targeted row's WHOLE config rather than merging into
# it, so the full config is restated here.
#
#   dsh --profile atlassian-dev --patch ./dev/overlay-no-browser.yml --port 43199 --no-open
#
# Then drive the flow over HTTP, e.g.
#   curl http://127.0.0.1:43199/plugins/atlassian/status
- id: atlassian
  config:
    # Deliberately NOT `atlassian`. The session store is keyed by
    # (serverName, url), so a dev run under the production name loads the
    # authorization you actually use — and when the access token has expired
    # and the refresh fails, the OAuth client clears `tokens` out of it, which
    # costs you a re-authorization in your real profile. A distinct name gives
    # this profile its own store file and makes that impossible.
    serverName: atlassian-dev
    url: https://mcp.atlassian.com/v1/mcp
    redirectPort: 3334
    # Empty so this sample works for any site. Put your own site here if you
    # want the post-authorization mismatch check while developing.
    expectedSite: ''
    toolCallTimeoutMs: 60000
    authorizationTimeoutMs: 300000
    autoOpenBrowser: false
